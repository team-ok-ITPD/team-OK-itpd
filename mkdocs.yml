site_name: Debug GYM
site_description: Prepared Python debugging exercises and project documentation
site_url: https://team-ok-itpd.github.io/team-OK-itpd/
repo_url: https://github.com/team-ok-ITPD/team-OK-itpd
edit_uri: blob/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: mkdocs
hooks:
  - scripts/docs_links.py
nav:
  - Home: index.md
  - Setup and run: setup.md
  - Product vision: product-vision.md
  - Requirements:
      - Functional requirements: functional-requirements/README.md
      - Quality requirements: quality-requirements/README.md
  - Architecture:
      - Overview: architecture/README.md
      - ADR-001 - Stack and responsibilities: architecture/adr/ADR-001.md
      - ADR-002 - Exercise representation: architecture/adr/ADR-002.md
      - ADR-003 - Workspace isolation: architecture/adr/ADR-003.md
  - Planning:
      - Threshold of success: threshold-of-success.md
      - Project plan: project-plan.md
      - Risks: risks.md
      - Definition of Done: definition-of-done.md
  - Decisions: decisions.md
  - Assumptions: assumptions.md
  - Research:
      - Value proposition: research/value-proposition.md
      - Gap analysis: research/gap-analysis.md
      - Comparison: research/comparison.md
      - Alternatives: research/alternatives.md

markdown_extensions:
  - attr_list
validation:
  links:
    anchors: warn
    unrecognized_links: warn
