name: Task
description: Track one unit of work that one pull request will close.
labels:
  - task
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the single unit of work and why it is needed.
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: Story
      description: "Optional story issues and criteria this task serves, one per bullet, for example `- #42 (AC-01, AC-02)`."
      placeholder: |
        - #42 (AC-01, AC-02)
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Add observable pass/fail checks for this task. The reviewer ticks every item before approval.
      value: "- [ ] AC-01: "
    validations:
      required: true
