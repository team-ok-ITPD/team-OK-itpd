name: Product checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --requirement app/adel_b/requirements.txt

      - name: Linting (not applicable)
        run: echo "Not applicable because the project has not adopted a product-code linter."

      - name: Formatting (not applicable)
        run: echo "Not applicable because the project has not adopted an automated product-code formatter."

      - name: Type checking (not applicable)
        run: echo "Not applicable because the JavaScript and Python product code has no static type-checking configuration."

      - name: Automated tests - catalog and exercise contract
        run: python -m pytest

      - name: Automated tests - Django application
        working-directory: app/adel_b
        run: python manage.py test

      - name: Automated tests - VS Code extension
        run: node --test app/adel_b/vscode-extension/test/*.test.js

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker build --tag debug-gym:test .

      - name: Start product image
        run: |
          docker run --detach --name debug-gym \
            --publish 127.0.0.1:3000:3000 \
            --publish 127.0.0.1:8080:8080 \
            debug-gym:test

      - name: Check catalog and workspace
        run: |
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health \
              && curl --fail --silent http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs debug-gym
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs debug-gym
