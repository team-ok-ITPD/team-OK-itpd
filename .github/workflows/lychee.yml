name: Check Links

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lychee:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.0.2
        with:
          args: '--verbose --no-progress --max-retries 3 .'
          fail: true